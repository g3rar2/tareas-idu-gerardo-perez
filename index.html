<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <title>Title</title>
</head>
<body>

<button class="bg-brand text-color-white text-center rounded p-2">Boton</button>

<div class="m-72 bg-orange-600">Hola</div>

<div class="bg-gray-200 p-4 custom-w">
  Esta caja tiene un ancho personalizado de 300px.
</div>

<button class="bg-blue-500 text-white p-2 mt-4 custom-min-w">
  Botón con texto largo que se expande
</button>

<div class="bg-green-200 p-4 mt-4 custom-min-h">
  Este contenedor tiene una altura mínima de 100px.
</div>

<div class="bg-red-200 xs:bg-yellow-200 sm:bg-green-200 md:bg-blue-200 lg:bg-purple-200">
  Este div cambia de color de fondo según el tamaño de la pantalla.
</div>

</body>
</html>
